datasets:
  ssv2_train:
    official_source: https://developer.qualcomm.com/software/ai-datasets/something-something
    archive_mirror_repo_id: morpheushoc/something-something-v2
    archive_mirror_revision: bc4a6e2b1c32e0b3608baf1d1a837b582f0057a8
    metadata_repo_id: HuggingFaceM4/something_something_v2
    metadata_revision: 130db220f301e31219875231983a9827c8370aa1
    split: train
    expected_examples: 168913
    direction_assignment: TAT-VQA/aot.py:assign_balanced_aot
  aot_psyphybench:
    code_and_metadata: Lis-f/which-way-does-time-flow
    metadata_revision: 2d62680ed58c1d6d4849f2bf665bd9214d9d1277
    video_source: Multi-Moments in Time official dataset
    expected_source_clips: 212
    expected_examples: 424

video:
  frames: 16
  train_sampling: rand
  evaluation_sampling: middle
  reversal: virtual_reverse_before_decode
  spatial_preprocessing: TAT-VQA/dataset/__init__.py:create_dataset

probe:
  source: Tracing the Arrow of Time, arXiv:2605.07568
  implementation: facebookresearch/vjepa2/src/models/attentive_pooler.py:AttentiveClassifier
  architecture:
    heads: 16
    mlp_ratio: 4.0
    classes: 2
  optimization:
    optimizer: AdamW
    learning_rate: 0.0001
    weight_decay: 0.01
    scheduler: cosine
    final_learning_rate: 0.0
    epochs: 1
    batch_size_per_rank: 4
  metrics: [accuracy, forward_f1, backward_f1, confusion_matrix]
