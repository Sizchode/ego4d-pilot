schema_version: 1
project:
  name: temporal-representation-transfer-pilot
  seed: 42

upstreams:
  transformers:
    repository: https://github.com/huggingface/transformers.git
    revision: 6ec0f83563f56335d4227354614459a01d76ba0d
  lmms_eval:
    repository: https://github.com/EvolvingLMMs-Lab/lmms-eval.git
    revision: 7e71cb99ddf8fe85c29e5f256dca5200cbd6211d
  tat_vqa:
    repository: https://github.com/HanPT831/TAT-VQA.git
    revision: 7f6275b995492363f6ea9bc7ca42886be3c44d1d
  aot_psyphybench:
    repository: https://github.com/mattashiho233/AoT-PsyPhyBENCH.git
    revision: 2d62680ed58c1d6d4849f2bf665bd9214d9d1277
  vjepa2:
    repository: https://github.com/facebookresearch/vjepa2.git
    revision: 11b731c65ae7c964c256960ec6e3acf34d4eb29b
  videomaev2:
    repository: https://github.com/OpenGVLab/VideoMAEv2.git
    revision: 29eab1e8a588d1b3ec0cdec7b03a86cca491b74b

models:
  qwen3:
    provider: qwen3
    repo_id: Qwen/Qwen3-VL-8B-Instruct
    revision: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
    local_directory: qwen3
    dtype: bfloat16
    attention: sdpa
    expected_architecture:
      vision_depth: 27
      vision_hidden_size: 1152
      vision_output_size: 4096
      deepstack_visual_indexes: [8, 16, 24]
      language_depth: 36
    representations:
      vision_blocks: [8, 16, 24, 26]
      include_visual_merger: true
      post_deepstack_language_layers: [0, 1, 2]
      include_final_language_visual_tokens: true
    prompt: Determine whether the video is playing forward or backward.
  vjepa2:
    provider: vjepa2
    repo_id: facebook/vjepa2-vitl-fpc64-256
    revision: b3c1679b7c34d3255ef3547f27c7b226aefab26f
    local_directory: vjepa2-vitl
    dtype: bfloat16
    attention: sdpa
    expected_hidden_size: 1024
    representation: last_hidden_state
  videomaev2:
    provider: videomaev2
    repo_id: OpenGVLab/VideoMAEv2-giant
    revision: d27568eb41ccb2d41bb191fc2e3fe5aad74942d4
    local_directory: videomaev2-giant
    dtype: bfloat16
    trust_remote_code: true
    expected_hidden_size: 1408
    representation: last_encoder_tokens

datasets:
  ssv2:
    role: probe_train
    split: train
    metadata_repo_id: HuggingFaceM4/something_something_v2
    metadata_revision: 130db220f301e31219875231983a9827c8370aa1
    expected_examples: 168913
    direction_assignment:
      implementation: TAT-VQA/aot.py:assign_balanced_aot
      method: balanced_label_shuffle_over_sorted_video_names
      seed: 42
      forward_label: 0
      backward_label: 1
  aot_psyphybench:
    role: probe_evaluation
    metadata_revision: 2d62680ed58c1d6d4849f2bf665bd9214d9d1277
    expected_source_clips: 212
    expected_examples: 424
    pair_each_source_forward_backward: true
    forward_label: 0
    backward_label: 1
  vitatecs_direction:
    role: temporal_language_evaluation
    repo_id: lscpku/VITATECS
    revision: 76e097816a372a947962093249d31cdfe4a32135
    lmms_task: vitatecs_direction
    metric: accuracy
  tvbench:
    role: temporal_language_evaluation
    repo_id: FunAILab/TVBench
    revision: 1d933b2aced8da5d6b315bb6a37807d126e05526
    lmms_task: tvbench
    metric: tvbench_acc
  mvbench:
    role: general_control
    repo_id: OpenGVLab/MVBench
    revision: a776e554280b99b70f00cc3eacd69a65e0727efc
    lmms_task: mvbench
    metric: mvbench_accuracy

video:
  frames: 16
  train_sampling:
    implementation: TAT-VQA/dataset/video_utils.py:get_frame_indices
    mode: rand
  evaluation_sampling:
    implementation: TAT-VQA/dataset/video_utils.py:get_frame_indices
    mode: middle
  reversal: virtual_reverse_before_decode
  spatial_preprocessing:
    implementation: TAT-VQA/dataset/__init__.py:create_dataset
    train:
      transform: random_resized_crop_and_horizontal_flip
      size: 224
      scale: [0.5, 1.0]
      ratio: [0.75, 1.3333333333333333]
      horizontal_flip_probability: 0.5
      interpolation: bicubic
    evaluation:
      transform: resize
      height: 224
      width: 224
      interpolation: bicubic
  normalization: provider_official_processor

probe:
  source: Tracing the Arrow of Time, arXiv:2605.07568
  implementation: facebookresearch/vjepa2/src/models/attentive_pooler.py:AttentiveClassifier
  architecture:
    type: attentive_classifier
    queries: 1
    cross_attention_layers: 1
    heads: 16
    mlp_ratio: 4.0
    classes: 2
    qkv_bias: true
    complete_block: true
    initialization_standard_deviation: 0.02
  optimization:
    optimizer: AdamW
    optimizer_source: facebookresearch/vjepa2 frozen attentive-probe implementation
    learning_rate: 0.0001
    weight_decay: 0.01
    scheduler: cosine
    final_learning_rate: 0.0
    epochs: 1
    batch_size_per_rank: 4
    gradient_accumulation_steps: 1
  metrics:
    primary: accuracy
    diagnostics: [forward_f1, backward_f1, confusion_matrix]

language_evaluation:
  model: qwen3
  tasks: [vitatecs_direction, tvbench, mvbench]
  batch_size_per_rank: 1
  model_arguments:
    max_num_frames: 32
    min_pixels: 50176
    max_pixels: 1605632
    attention: sdpa
  generation: task_definitions
