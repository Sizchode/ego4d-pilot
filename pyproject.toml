[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-transfer"
version = "0.1.0"
description = "Frozen temporal representation diagnosis for modern Video-VLMs"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
train = [
  "torch>=2.4",
  "torchvision>=0.19",
  "decord>=0.6.0",
  "transformers @ git+https://github.com/huggingface/transformers.git@6ec0f83563f56335d4227354614459a01d76ba0d",
  "accelerate>=1.10,<2",
  "huggingface-hub>=0.35",
  "safetensors>=0.5",
  "timm>=1.0,<2",
]
eval = [
  "qwen-vl-utils>=0.0.14",
]
test = [
  "ruff>=0.9",
]

[project.scripts]
temporal-transfer-validate = "temporal_transfer.cli.validate_protocol:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 112
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]
